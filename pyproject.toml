[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "carm-paraver"
version = "1.0.0.dev1"
description = "Dash-based CARM analysis for Paraver traces"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "CARM Contributors"}
]
dependencies = [
    "dash>=4.1.0",
    "dash-bootstrap-components>=2.0.4",
    "dash-daq>=0.6.0",
    "numpy>=2.0.0",
    "pandas>=2.3.3",
    "platformdirs>=4.2.2",
    "plotly>=6.0.0",
]

[project.scripts]
carm-paraver = "carm_paraver.__main__:main"
# For compatibility with Paraver
"Paraver_CARM.py" = "carm_paraver.__main__:main"

[tool.setuptools]
packages = {find = {where = ["."], exclude = ["tests*", "tools*"]}}
include-package-data = true

[tool.setuptools.package-data]
carm_paraver = [
    "assets/*",
    "assets/**/*",
    "paraver_carm_configs/**/*",
    "sample_data/**/*",
]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
# Start with a focused but helpful rule set; expand later as refactoring stabilizes.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # import sorting (isort)
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
    "W",   # pycodestyle warnings
]
ignore = [
    "E203",  # black compatibility for slices
    "E266",  # allow double-line comments when needed
    "E501",  # defer to formatter for line length
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
# Configure import sorting to match common Python conventions
known-first-party = ["carm_paraver"]
force-single-line = false  # Allow grouped imports for readability
combine-as-imports = true  # Combine "as" imports on same line

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"
